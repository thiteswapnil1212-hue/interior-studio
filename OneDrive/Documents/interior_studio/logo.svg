&lt;svg width="400" height="100" viewBox="0 0 400 100" xmlns="http://www.w3.org/2000/svg"&gt;
  &lt;defs&gt;
    &lt;linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%"&gt;
      &lt;stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" /&gt;
      &lt;stop offset="50%" style="stop-color:#FFA500;stop-opacity:1" /&gt;
      &lt;stop offset="100%" style="stop-color:#FFD700;stop-opacity:1" /&gt;
    &lt;/linearGradient&gt;
    &lt;filter id="glow" x="-50%" y="-50%" width="200%" height="200%"&gt;
      &lt;feGaussianBlur stdDeviation="3" result="coloredBlur"/&gt;
      &lt;feMerge&gt;
        &lt;feMergeNode in="coloredBlur"/&gt;
        &lt;feMergeNode in="SourceGraphic"/&gt;
      &lt;/feMerge&gt;
    &lt;/filter&gt;
  &lt;/defs&gt;

  &lt;!-- Sofa Icon --&gt;
  &lt;g transform="translate(20, 25)"&gt;
    &lt;!-- Sofa Base --&gt;
    &lt;rect x="0" y="30" width="60" height="20" fill="#000000" rx="5"/&gt;
    &lt;!-- Sofa Back --&gt;
    &lt;rect x="5" y="10" width="50" height="25" fill="#000000" rx="5"/&gt;
    &lt;!-- Sofa Arms --&gt;
    &lt;rect x="-5" y="20" width="10" height="30" fill="#000000" rx="5"/&gt;
    &lt;rect x="55" y="20" width="10" height="30" fill="#000000" rx="5"/&gt;
    &lt;!-- Golden Accents --&gt;
    &lt;rect x="0" y="30" width="60" height="5" fill="url(#goldGradient)" filter="url(#glow)"/&gt;
    &lt;rect x="5" y="10" width="50" height="5" fill="url(#goldGradient)" filter="url(#glow)"/&gt;
  &lt;/g&gt;

  &lt;!-- Text --&gt;
  &lt;text x="120" y="65" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#000000"&gt;Interior Studio&lt;/text&gt;
  &lt;text x="120" y="65" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="url(#goldGradient)" filter="url(#glow)"&gt;Interior Studio&lt;/text&gt;
&lt;/svg&gt;